
name: Build rain map
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy requests rasterio matplotlib
      - run: python kanchanaburi_rain_map.py --days 7 --out rain_map.png
      - name: Save the new map
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add rain_map.png
          git diff --cached --quiet || git commit -m "Update rain map"
          git push
